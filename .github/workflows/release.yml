name: Release

on:
  push:
    tags:
      - "v*"
      - "dev"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      is_dev: ${{ steps.parse.outputs.is_dev }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Parse tag
        id: parse
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$RAW_TAG" == "dev" ]]; then
            # dev tag: use base version from Cargo.toml with -dev suffix
            BASE=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            # Strip any existing pre-release suffix (e.g. "0.0.11-dev" -> "0.0.11")
            BASE="${BASE%%-*}"
            echo "version=${BASE}-dev" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          else
            TAG="${RAW_TAG#v}"
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            if [[ "$TAG" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (musl — static linking, no glibc dependency)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: cs-linux-amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: cs-linux-arm64
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            name: cs-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: cs-darwin-arm64
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: cs-windows-amd64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: cs-windows-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch 2026-07
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (Linux ARM64 musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 64b5bb4d3d34de062552b9a2093affe77b4ad16a

      - name: Inject version into Cargo.toml
        shell: bash
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          echo "Building version: ${VERSION}"
          grep '^version' Cargo.toml

      - name: Build release binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/codex-switch"
          chmod +x "$BIN"
          tar czf "${{ matrix.name }}.tar.gz" -C "target/${{ matrix.target }}/release" codex-switch
          shasum -a 256 "${{ matrix.name }}.tar.gz" > "${{ matrix.name }}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          7z a "${{ matrix.name }}.zip" "./target/${{ matrix.target }}/release/codex-switch.exe"
          sha256sum "${{ matrix.name }}.zip" > "${{ matrix.name }}.zip.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.tar.gz.sha256
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.zip.sha256
          if-no-files-found: ignore

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Verify release checksums
        shell: bash
        run: |
          archives=(
            cs-linux-amd64.tar.gz
            cs-linux-arm64.tar.gz
            cs-darwin-amd64.tar.gz
            cs-darwin-arm64.tar.gz
            cs-windows-amd64.zip
            cs-windows-arm64.zip
          )
          for name in "${archives[@]}"; do
            archive="artifacts/${name}"
            checksum="${archive}.sha256"
            if [[ ! -s "$archive" || ! -s "$checksum" ]]; then
              echo "Missing or empty release archive/checksum: $archive / $checksum" >&2
              exit 1
            fi
            (
              cd artifacts
              sha256sum --check "$(basename "$checksum")"
            )
          done

      - name: Generate install script body
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          cat > artifacts/INSTALL.md << 'HEREDOC'
          ## Quick Install

          ### macOS / Linux (one-liner)

          ```bash
          curl -fsSL https://raw.githubusercontent.com/xjoker/codex-switch/master/scripts/install.sh | bash
          ```

          ### Windows (PowerShell)

          ```powershell
          irm https://raw.githubusercontent.com/xjoker/codex-switch/master/scripts/install.ps1 | iex
          ```

          ### Manual Download

          Download the appropriate binary from the assets below and place it in your PATH.
          HEREDOC

      - name: Copy install scripts
        run: |
          cp scripts/install.sh artifacts/install.sh
          cp scripts/install.ps1 artifacts/install.ps1

      - name: Delete existing dev release
        if: needs.meta.outputs.is_dev == 'true'
        run: gh release delete dev --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dev release body
        if: needs.meta.outputs.is_dev == 'true'
        id: dev_body
        run: |
          cat > dev_body.md << EOF
          Development build from \`${{ github.ref }}\` at ${{ github.sha }}.

          **This is a pre-release build for testing.** Use \`codex-switch self-update --dev\` to install, or \`codex-switch self-update --stable\` to return to the latest stable release.

          **Older macOS/Linux direct install in \`/usr/local/bin\`:** migrate once with the matching user-level installer. It verifies the download, requests \`sudo\` once, installs to \`~/.local/bin\`, removes the old binary, and preserves profiles and configuration.

          \`curl -fsSL https://github.com/xjoker/codex-switch/releases/download/dev/install.sh | bash -s -- --dev\`

          Version: \`${{ needs.meta.outputs.version }}\`
          EOF

      - name: Create GitHub Release (dev)
        if: needs.meta.outputs.is_dev == 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: dev
          name: "dev (${{ needs.meta.outputs.version }})"
          prerelease: true
          body_path: dev_body.md
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (stable)
        if: needs.meta.outputs.is_dev != 'true'
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: v${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            **Older macOS/Linux direct install in `/usr/local/bin`:** migrate once with the matching user-level installer. It verifies the download, requests `sudo` once, installs to `~/.local/bin`, removes the old binary, and preserves profiles and configuration.

            `curl -fsSL https://github.com/xjoker/codex-switch/releases/download/v${{ needs.meta.outputs.version }}/install.sh | bash`
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  legacy-upgrade:
    needs: [meta, release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_VERSION: ${{ needs.meta.outputs.version }}
      IS_DEV: ${{ needs.meta.outputs.is_dev }}
    steps:
      - name: Upgrade v0.0.19 on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              asset="cs-linux-amd64.tar.gz"
              pinned_hash="3589fdac3d480aea83ab61dd4fb0a7592c018a44415842083df2d5f1d0bb0d2f"
              ;;
            Linux-aarch64|Linux-arm64)
              asset="cs-linux-arm64.tar.gz"
              pinned_hash="5db981cc5f1380f3bf9ac2d66484c0cc67d06712e617c2cd0457e3058dcb12b0"
              ;;
            Darwin-x86_64)
              asset="cs-darwin-amd64.tar.gz"
              pinned_hash="cbc4229285c5e8ea02c9463b7868cd03f2021f5125f5b187ff99e3bebe16e278"
              ;;
            Darwin-arm64)
              asset="cs-darwin-arm64.tar.gz"
              pinned_hash="2e365dc8273c04ee634d593eeada338a46ba7c7db2a1ca8f5c2aff30aec57a98"
              ;;
            *) echo "Unsupported legacy-upgrade runner: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          work="${RUNNER_TEMP}/codex-switch-legacy-upgrade"
          mkdir -p "$work/home"
          base="https://github.com/xjoker/codex-switch/releases/download/v0.0.19"
          curl -fsSL "${base}/${asset}" -o "${work}/${asset}"
          curl -fsSL "${base}/${asset}.sha256" -o "${work}/${asset}.sha256"
          (
            cd "$work"
            printf '%s  %s\n' "$pinned_hash" "$asset" | shasum -a 256 -c -
            shasum -a 256 -c "${asset}.sha256"
            tar xzf "$asset"
          )
          bin="${work}/codex-switch"
          test "$("$bin" --version | head -n 1)" = "codex-switch 0.0.19"
          updated=false
          for attempt in 1 2 3 4 5; do
            if [[ "$IS_DEV" == "true" ]]; then
              HOME="${work}/home" "$bin" self-update --dev && updated=true && break
            else
              HOME="${work}/home" "$bin" self-update --stable && updated=true && break
            fi
            if [[ "$attempt" -lt 5 ]]; then
              echo "Retrying legacy self-update after GitHub Release propagation delay"
              sleep 5
            fi
          done
          test "$updated" = true
          test "$("$bin" --version | head -n 1)" = "codex-switch ${EXPECTED_VERSION}"

      - name: Upgrade v0.0.19 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "codex-switch-legacy-upgrade"
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $asset = "cs-windows-amd64.zip"
          $base = "https://github.com/xjoker/codex-switch/releases/download/v0.0.19"
          $archive = Join-Path $work $asset
          $checksum = "${archive}.sha256"
          Invoke-WebRequest -Uri "$base/$asset" -OutFile $archive
          Invoke-WebRequest -Uri "$base/$asset.sha256" -OutFile $checksum
          $expectedHash = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "v0.0.19 checksum mismatch" }
          $pinnedHash = "9ff8a3f8794517771ef6959632417fdf1dfbc85b7fdf4c344998223985582e63"
          if ($actualHash -ne $pinnedHash) { throw "v0.0.19 archive changed from the reviewed fixture" }
          Expand-Archive -Path $archive -DestinationPath $work -Force
          $bin = Join-Path $work "codex-switch.exe"
          if (@(& $bin --version)[0] -ne "codex-switch 0.0.19") {
            throw "unexpected legacy version"
          }
          $updated = $false
          foreach ($attempt in 1..5) {
            if ($env:IS_DEV -eq "true") {
              & $bin self-update --dev
            } else {
              & $bin self-update --stable
            }
            if ($LASTEXITCODE -eq 0) {
              $updated = $true
              break
            }
            if ($attempt -lt 5) {
              Write-Host "Retrying legacy self-update after GitHub Release propagation delay"
              Start-Sleep -Seconds 5
            }
          }
          if (-not $updated) { throw "v0.0.19 self-update failed" }
          if (@(& $bin --version)[0] -ne "codex-switch $env:EXPECTED_VERSION") {
            throw "legacy upgrade installed an unexpected version"
          }

  homebrew:
    needs: [meta, release]
    if: needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Download sha256 files
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          BASE="https://github.com/xjoker/codex-switch/releases/download/v${VERSION}"
          for name in cs-darwin-arm64 cs-darwin-amd64 cs-linux-arm64 cs-linux-amd64; do
            curl -fsSL "${BASE}/${name}.tar.gz.sha256" -o "${name}.sha256"
          done

      - name: Extract sha256 values
        id: sha
        run: |
          echo "darwin_arm64=$(awk '{print $1}' cs-darwin-arm64.sha256)" >> "$GITHUB_OUTPUT"
          echo "darwin_amd64=$(awk '{print $1}' cs-darwin-amd64.sha256)" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(awk '{print $1}' cs-linux-arm64.sha256)" >> "$GITHUB_OUTPUT"
          echo "linux_amd64=$(awk '{print $1}' cs-linux-amd64.sha256)" >> "$GITHUB_OUTPUT"

      - name: Generate formula
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          BASE="https://github.com/xjoker/codex-switch/releases/download/v${VERSION}"

          # Generate latest formula (codex-switch.rb)
          cat > codex-switch.rb << RUBY
          class CodexSwitch < Formula
            desc "Codex account switcher — multi-profile manager with usage dashboard"
            homepage "https://github.com/xjoker/codex-switch"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE}/cs-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"
              end
              on_intel do
                url "${BASE}/cs-darwin-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_amd64 }}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE}/cs-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
              end
              on_intel do
                url "${BASE}/cs-linux-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_amd64 }}"
              end
            end

            def install
              bin.install "codex-switch"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/codex-switch --version")
            end
          end
          RUBY

          # Generate versioned formula (codex-switch@X.Y.Z.rb)
          # Homebrew requires unique class names: CodexSwitchATx_y_z
          CLASS_SUFFIX=$(echo "${VERSION}" | tr '.' '_')
          cat > "codex-switch@${VERSION}.rb" << RUBY
          class CodexSwitchAT${CLASS_SUFFIX} < Formula
            desc "Codex account switcher — multi-profile manager with usage dashboard"
            homepage "https://github.com/xjoker/codex-switch"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE}/cs-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"
              end
              on_intel do
                url "${BASE}/cs-darwin-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_amd64 }}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE}/cs-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
              end
              on_intel do
                url "${BASE}/cs-linux-amd64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_amd64 }}"
              end
            end

            keg_only :versioned_formula

            def install
              bin.install "codex-switch"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/codex-switch --version")
            end
          end
          RUBY

      - name: Push formula to tap
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/xjoker/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp codex-switch.rb tap/Formula/codex-switch.rb
          cp "codex-switch@${VERSION}.rb" "tap/Formula/codex-switch@${VERSION}.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "codex-switch ${VERSION} (latest + versioned formula)"
          git push
